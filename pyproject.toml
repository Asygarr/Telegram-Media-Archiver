[project]
name = "tgdl"
version = "0.1.0"
description = "Telegram Protected Media Downloader (MTProto)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  # kurigram: fork Pyrogram yang dipelihara aktif & kompatibel dengan Python baru
  # (drop-in, tetap memakai namespace `import pyrogram`).
  "kurigram>=2.2",
  "python-dotenv>=1.0",
  "pydantic-settings>=2.0",
  "typer>=0.12",
  "rich>=13.0",
  "aiohttp>=3.9",
]

[project.optional-dependencies]
# Akselerasi enkripsi (opsional). Wheel mungkin belum tersedia di Python terbaru.
speed = [
  "tgcrypto>=1.2",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
tgdl = "tgdl.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tgdl = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
